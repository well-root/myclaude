[project]
name = "myclaude"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "17254", email = "1725424087@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.25",
    "httpx[socks]>=0.28.1",
    "pydantic>=2.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.0",
    "textual>=0.75",
]
#进程的入口
[project.scripts]
myclaude = "myclaude.cli.main:main"
myclaude-core="myclaude.core.app:run"
myclaude-tui="myclaude.tui.__main__:main"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[build-system]
requires = ["uv_build>=0.12.1"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
