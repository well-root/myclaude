<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="myclaude banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="298" rx="27" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- window chrome -->
  <circle cx="52" cy="52" r="9" fill="#ef4444"/>
  <circle cx="82" cy="52" r="9" fill="#f59e0b"/>
  <circle cx="112" cy="52" r="9" fill="#22c55e"/>
  <line x1="0" y1="82" x2="1200" y2="82" stroke="#1f2937" stroke-width="2"/>

  <!-- terminal lines -->
  <text x="56" y="132" font-family="'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="26" fill="#64748b">$ myclaude core start</text>
  <text x="56" y="170" font-family="'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="26" fill="#34d399">● listening on 127.0.0.1:7437</text>

  <!-- title -->
  <text x="56" y="246" font-family="'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="72" font-weight="700" fill="url(#accent)" filter="url(#glow)">myclaude</text>
  <text x="60" y="280" font-family="'Segoe UI', system-ui, sans-serif" font-size="22" fill="#94a3b8">local AI coding agent · daemon + CLI + TUI · Python 3.12</text>

  <!-- decorative prompt -->
  <text x="990" y="238" font-family="'Cascadia Code', Consolas, monospace" font-size="150" font-weight="700" fill="#1e293b" opacity="0.9">&gt;_</text>
</svg>
